; zigsaw's PHP: PHP's built-in defaults, plus where its extensions are, which
; of them are on, and curl's root certificates. PHPRC, which the image sets so
; that PHP reads this file and no other, is the image's directory.
; php.ini-development and php.ini-production next to it are PHP's own
; suggestions; an app changes settings with an .ini of its own in a
; directory PHP_INI_SCAN_DIR names.

extension_dir = "${PHPRC}\ext"

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip

; PHP's curl uses OpenSSL, which doesn't read Windows' certificate stores:
; these are Windows' trusted roots, in the file zigsaw writes of them
; (${roots}, which the image sets SSL_CERT_FILE to; Composer reads it too).
; PHP's other TLS (https:// streams, stream_socket_client) checks with
; Windows' stores itself.
curl.cainfo = "${SSL_CERT_FILE}"
