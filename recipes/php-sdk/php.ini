; zigsaw's PHP: PHP's built-in defaults, plus where its extensions are, which
; of them are on, and curl's certificates. PHPRC, which the image sets so
; that PHP reads this file and no other, is the image's directory.
; php.ini-development and php.ini-production next to it are PHP's own
; suggestions; an app changes settings with an .ini of its own in a
; directory PHP_INI_SCAN_DIR names.

extension_dir = "${PHPRC}\ext"

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip

; PHP's curl uses OpenSSL, which has no certificates of its own on Windows:
; these are Mozilla's, as curl's project publishes them. PHP's other TLS
; (https:// streams, stream_socket_client) checks with Windows' certificate
; stores instead.
curl.cainfo = "${PHPRC}\extras\ssl\cacert.pem"
