# Publishes a release of zigsaw when a tag v<version> is pushed, the version
# being build.zig.zon's: the unit tests, then scripts/package.sh's files,
# checked by tests/install.sh, as the release's assets (the zip,
# install.ps1, SHA256SUMS), with notes listing the programs' hashes. The
# programs are built without debug information, so a build of the tag
# anywhere, with the same Zig, has those hashes; tests/self.sh checks that
# zigsaw building its own zigsaw.json has them too. Images are still
# published by hand (scripts/publish.sh).
#
# Then the sign job, on another runner, signs the release keyless
# (scripts/sign-release.sh --keyless): once the Reproduce workflow passed on the
# tag's commit, and a build of the tag there made the same six programs. Until
# then the release is out but unsigned, and zigsaw tells nobody about it. If
# Reproduce hadn't passed yet, the job fails saying so: re-run it ("Re-run failed
# jobs" keeps the tag, which the signature names) once it has.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: The tag is build.zig.zon's version, and zigsaw.json's
        shell: bash
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, but build.zig.zon's version is $version"
              exit 1
          fi
          if ! grep -q "^  \"version\": \"$version\",\$" zigsaw.json; then
              echo "::error::zigsaw.json's version isn't build.zig.zon's, $version"
              exit 1
          fi

      - name: Unit tests
        run: zig build test --summary all

      - name: Package
        shell: bash
        run: bash scripts/package.sh

      - name: tests/install.sh, on the package
        shell: bash
        env:
          PACKAGE_DIR: zig-out\release
        run: bash tests/install.sh

      # The package's zigsaw builds the checkout's zigsaw.json, and makes the
      # package's programs.
      - name: tests/self.sh, on the package
        shell: bash
        env:
          PACKAGE_DIR: zig-out\release
        run: bash tests/self.sh

      # Not published if Defender flags these bytes: Windows wouldn't start them
      # (docs/findings.md). Says so and goes on where it can't scan.
      - name: What Defender makes of the programs
        shell: bash
        run: bash scripts/defender-scan.sh zig-out/release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd zig-out/release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "zigsaw ${GITHUB_REF_NAME#v}" --notes-file notes.md \
              zigsaw-x86_64-windows.zip install.ps1 SHA256SUMS VERSION

  sign:
    needs: release
    runs-on: windows-2025
    timeout-minutes: 30
    # The identity token is what Sigstore's certificate is for: this workflow, at
    # this tag.
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Check the release, and sign it keyless
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sign-release.sh --keyless "$GITHUB_REF_NAME"
