# Checks that the published recipes build the same images on a fresh machine:
# runs the unit tests, then builds each recipe in scripts/published-recipes.txt
# and compares its digest with the image published for the recipe's version
# (tests/published.sh). It only verifies; scripts/publish.sh publishes.
name: Reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Unit tests
        run: zig build test --summary all

      - name: Build zigsaw
        run: zig build

      - name: Build the published recipes and compare them with the published images
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}\published-logs
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/published.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/published.txt"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-logs
          path: ${{ runner.temp }}\published-logs
          if-no-files-found: ignore
