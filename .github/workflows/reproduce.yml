# Checks that the published recipes build the same images on a fresh machine,
# and runs the end-to-end suites there, in jobs that run side by side:
# - published, one job for each group of scripts/published-groups.txt: the
#   group's recipes built and compared with the images published for the
#   recipes' versions (tests/published.sh);
# - suites: the suites in tests/ that run apps, in a store of the published
#   images (tests/seed-store.sh), which the published jobs check are what the
#   recipes build;
# - gtk-suites: tests/gtk.sh and tests/gtk3.sh, the same way, in a store of
#   GTK's published images and the apps on them;
# - build, one job for each group of tests/build.sh's sections: the group's
#   checks, in stores of their own, downloading what they build from; the
#   base group's job runs the unit tests first.
# And two quick ones:
# - groups: the groups the published and build jobs are made from;
# - pins: every image the published recipes pin is on the registry, so a
#   fresh store can build them (scripts/check-pins.sh).
# It only verifies; scripts/publish.sh publishes.
name: Reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Requests to the registry, no building: Linux is enough.
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The published recipes' pins, on the registry
        run: bash scripts/check-pins.sh

  # The groups of scripts/published-groups.txt but skip, and those of
  # tests/build.sh, as JSON lists.
  groups:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      build: ${{ steps.groups.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: groups
        run: |
          groups=$(grep -v -e '^#' -e '^\s*$' scripts/published-groups.txt | cut -d: -f1 | grep -vx skip | awk '!seen[$0]++' | jq -Rnc '[inputs]')
          echo "groups=$groups" | tee -a "$GITHUB_OUTPUT"
          build=$(bash tests/build.sh --groups | jq -Rnc '[inputs]')
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  published:
    needs: groups
    name: published (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.groups) }}
    runs-on: windows-2025
    # All the groups in one job took 37 minutes after iteration 32; the
    # groups are balanced to some 10 to 13 minutes each. GTK's family takes
    # longer: its SDK alone, Rnote and Gnumeric are 15 to 25 minutes each.
    timeout-minutes: ${{ (startsWith(matrix.group, 'gtk') || matrix.group == 'rnote' || matrix.group == 'gnumeric') && 75 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "BUILD_HOME=$t\\store" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Build zigsaw
        run: zig build

      - name: Build the group's recipes and compare them with the published images
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/published.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/published.txt"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-published-${{ matrix.group }}
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore

  suites:
    runs-on: windows-2025
    # The suites took 6 minutes after iteration 32, in the job that had built
    # their apps.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "BUILD_HOME=$t\\store" "SEED_DOWNLOADS=$t\\store\\cache\\downloads" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Build zigsaw
        run: zig build

      # The apps tests/matrix.sh runs, zot for tests/zot.sh and ZLS for
      # tests/zls.sh. BusyBox and Node are built, for their downloads, which
      # the suites' own stores are seeded with.
      - name: The suites' apps, as published (built, if not published yet)
        shell: bash
        env:
          ZIGSAW_HOME: ${{ runner.temp }}\store
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/seed-store.sh --build busybox node --pull zig rust ripgrep bat go fzf zot cmake zstd mingit python java-sdk java maven gradle pdfbox plantuml zls 2>&1 | tee "$(cygpath -u "$LOG_DIR")/seed.txt"

      # The suites run whether or not the steps before them passed.
      - name: tests/store.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/store.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/store.txt"

      - name: tests/shims.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/shims.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/shims.txt"

      - name: tests/sandbox.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/sandbox.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/sandbox.txt"

      - name: tests/batch.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/batch.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/batch.txt"

      - name: tests/ctrlc.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/ctrlc.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/ctrlc.txt"

      # What the Release workflow publishes, and installing it.
      - name: tests/install.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/install.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/install.txt"

      # zot is the app recipes/zot.json builds, here as published (which a
      # published job checks); tests/zot.sh runs it with zigsaw.
      - name: tests/registry.sh, against two local zot registries
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/zot.sh bash tests/registry.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/registry.txt"

      # ZLS as published (which a published job checks), in the seeded store.
      - name: tests/zls.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ZLS_HOME: ${{ runner.temp }}\store
        run: bash tests/zls.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/zls.txt"

      # Last, in the seeded store, whose apps it runs: it changes their data.
      - name: tests/matrix.sh
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ZIGSAW_HOME: ${{ runner.temp }}\store
          # zig's project check compiles zig's build runner with a cold cache.
          MATRIX_TIMEOUT: 600
          LOG_DIR: ${{ runner.temp }}\logs
        run: bash tests/matrix.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/matrix.txt"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-suites
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore

  gtk-suites:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "GTK_HOME=$t\\store" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Build zigsaw
        run: zig build

      # GTK's images and the apps on them, as published; the suites install
      # them again rather than building them. (They build Pinta, which isn't
      # published, and .NET's images, from their recipes.)
      - name: The GTK suites' images, as published (built, if not published yet)
        shell: bash
        env:
          ZIGSAW_HOME: ${{ runner.temp }}\store
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/seed-store.sh --pull busybox zig meson mingit gtk4-sdk gtk4 gtk4-hunspell-vi gtk4-hunspell-fr gnome-text-editor rnote gtk3-sdk gtk3 gtk3demo gnumeric pygobject-sdk pygobject meld gaphor 2>&1 | tee "$(cygpath -u "$LOG_DIR")/seed.txt"

      - name: tests/gtk.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/gtk.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/gtk.txt"

      - name: tests/gtk3.sh
        if: ${{ !cancelled() }}
        shell: bash
        run: bash tests/gtk3.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/gtk3.txt"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-gtk-suites
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore

  build:
    needs: groups
    name: build (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.build) }}
    runs-on: windows-2025
    # All of tests/build.sh in one job took 22 minutes in iteration 33; its
    # groups are balanced to some 3 to 10 minutes each. They download what
    # they build from (BusyBox's from the sources pushed next to its image,
    # as frippery.org refuses runners).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Paths for the steps below
        shell: bash
        run: |
          t=$RUNNER_TEMP
          printf '%s\n' "TMP=$t" "TEMP=$t" "LOG_DIR=$t\\logs" >>"$GITHUB_ENV"

      - name: Unit tests
        if: matrix.group == 'base'
        run: zig build test --summary all

      - name: Build zigsaw
        run: zig build

      - name: tests/build.sh, the group's sections
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          mkdir -p "$(cygpath -u "$LOG_DIR")"
          bash tests/build.sh 2>&1 | tee "$(cygpath -u "$LOG_DIR")/build.txt"

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-build-${{ matrix.group }}
          path: ${{ runner.temp }}\logs
          if-no-files-found: ignore
